name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Workaround for npm optional-deps bug with Rolldown native bindings
      # (lockfile generated on Windows misses linux-x64-gnu binding).
      # See: https://github.com/npm/cli/issues/4828
      - run: rm -f package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL || 'https://dranixatorback-production.up.railway.app' }}
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
